<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkedIn Creator Watchlist</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar__title">
        <h1>LinkedIn Creator Watchlist</h1>
        <p id="summary" class="muted"></p>
      </div>
      <button id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">&#8635;</button>
    </header>

    <section id="people" class="people" aria-label="Watched people" hidden></section>

    <section id="controls" class="controls" hidden>
      <div class="row">
        <div class="segmented" role="group" aria-label="Sort posts">
          <button id="sort-recency" class="seg seg--on" type="button" aria-pressed="true">Recency</button>
          <button id="sort-outlier" class="seg" type="button" aria-pressed="false">Outlier ratio</button>
        </div>
      </div>
      <div class="row options">
        <label class="check"><input type="checkbox" id="opt-outliers-only" /> &gt;2&times; outliers only</label>
        <label class="check"><input type="checkbox" id="opt-notes" /> Include notes in export</label>
      </div>
      <div class="row exports">
        <button id="export-csv" class="btn">Export CSV</button>
        <button id="export-md" class="btn">Export Markdown</button>
      </div>
    </section>

    <section id="person-detail" class="person-detail" hidden>
      <div class="row">
        <strong id="person-name"></strong>
        <span id="person-quiet" class="quiet-badge" hidden></span>
        <button id="person-unwatch" class="link-btn person-detail__unwatch">Stop watching</button>
      </div>
      <p id="person-headline" class="muted small"></p>
      <label class="field">
        <span class="field__label">Note on this person</span>
        <textarea id="person-note" rows="2" placeholder="e.g. good at carousels, weak hooks"></textarea>
      </label>
    </section>

    <main id="body" class="body">
      <div id="state" class="state">
        <p class="state__text">Loading your watchlist&hellip;</p>
      </div>
      <ol id="list" class="list" hidden></ol>
    </main>

    <footer class="footer">
      <span id="status" class="muted small" role="status" aria-live="polite"></span>
      <span class="footer__actions">
        <button id="data-toggle" class="link-btn">Data</button>
        <button id="stats-toggle" class="link-btn">Usage</button>
      </span>
    </footer>

    <dialog id="data" class="sheet">
      <h2>Your data</h2>
      <p class="muted small">
        Everything lives in this browser's local storage. Nothing is uploaded, and there is no account.
      </p>
      <p id="quota" class="muted small"></p>
      <div class="row wrap">
        <button id="data-export" class="btn">Export all data</button>
        <button id="data-import" class="btn">Import</button>
        <button id="data-clear" class="btn btn--danger">Clear all data</button>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
      <div class="row end">
        <button id="data-close" class="btn btn--primary">Close</button>
      </div>
    </dialog>

    <dialog id="stats" class="sheet">
      <h2>Local usage counters</h2>
      <p class="muted small">Stored on this device only. Nothing is sent anywhere.</p>
      <pre id="stats-body" class="sheet__body"></pre>
      <div class="row end">
        <button id="stats-clear" class="btn">Reset</button>
        <button id="stats-close" class="btn btn--primary">Close</button>
      </div>
    </dialog>

    <script type="module" src="__PANEL_JS__"></script>
  </body>
</html>
