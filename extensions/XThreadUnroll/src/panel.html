<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Thread Unroll</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar__title">
        <h1>Thread Unroll</h1>
        <p id="summary" class="muted"></p>
      </div>
      <button id="stop" class="btn btn--danger" type="button" hidden>Stop</button>
    </header>

    <main id="body" class="body">
      <div id="state" class="state state--gate">
        <p class="gate__title">No thread open yet</p>
        <p class="gate__body">
          Go to a thread on X and click <strong>Unroll</strong> on its first post to read it here.
        </p>
      </div>
      <div id="note" class="note" hidden role="status" aria-live="polite"></div>
      <ol id="list" class="list" hidden aria-live="polite" aria-busy="false"></ol>
    </main>

    <footer class="footer">
      <div class="row">
        <label class="field__label visually-hidden" for="format">Export format</label>
        <select id="format">
          <option value="md">Markdown (.md)</option>
          <option value="txt">Plain text (.txt)</option>
        </select>
        <button id="copy" class="btn" type="button" disabled>Copy</button>
        <button id="download" class="btn btn--primary" type="button" disabled>Download</button>
      </div>
      <div class="row row--between">
        <span id="status" class="muted small" role="status" aria-live="polite"></span>
        <button id="usage-toggle" class="link-btn">Usage</button>
      </div>
    </footer>

    <dialog id="usage" class="sheet">
      <h2>Local usage counters</h2>
      <p class="muted small">Stored on this device only. Nothing is sent anywhere.</p>
      <pre id="usage-body" class="sheet__body"></pre>
      <div class="row end">
        <button id="usage-clear" class="btn">Reset</button>
        <button id="usage-close" class="btn btn--primary">Close</button>
      </div>
    </dialog>

    <script type="module" src="__PANEL_JS__"></script>
  </body>
</html>
