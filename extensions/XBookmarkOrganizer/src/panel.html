<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Bookmark Organizer</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar__title">
        <h1>X Bookmark Organizer</h1>
        <p id="count" class="muted"></p>
      </div>
      <button id="refresh" class="icon-btn" title="Refresh the library" aria-label="Refresh">&#8635;</button>
    </header>

    <section class="controls">
      <label class="field visually-hidden" for="search">Search bookmarks</label>
      <input
        id="search"
        type="search"
        placeholder="Search text, author, tag or note…"
        class="search"
        autocomplete="off"
      />

      <div class="row">
        <label class="field__label" for="collection-filter">Folder</label>
        <select id="collection-filter"></select>
        <button id="collection-rename" class="link-btn">Rename</button>
      </div>
      <div class="row">
        <button id="collection-new" class="link-btn">+ New folder</button>
      </div>

      <div class="row">
        <label class="field__label" for="tag-filter">Tag</label>
        <select id="tag-filter">
          <option value="all">All tags</option>
        </select>
      </div>

      <div class="row reindex-row">
        <button id="reindex" class="btn">Re-index bookmarks</button>
        <span id="reindex-status" class="muted small" role="status" aria-live="polite"></span>
      </div>
    </section>

    <main id="body" class="body">
      <div id="state" class="state">
        <p class="state__text">Loading your library…</p>
      </div>
      <ol id="list" class="list" hidden></ol>
    </main>

    <footer class="footer">
      <span id="status" class="muted small" role="status" aria-live="polite"></span>
      <span class="footer__actions">
        <button id="data-toggle" class="link-btn">Data</button>
        <button id="stats-toggle" class="link-btn">Usage</button>
      </span>
    </footer>

    <dialog id="data" class="sheet">
      <h2>Your data</h2>
      <p class="muted small">
        Everything lives in this browser's local storage. Nothing is uploaded, and there is no account.
      </p>
      <p id="quota" class="muted small"></p>
      <div class="row wrap">
        <button id="export-md" class="btn">Export as .md</button>
        <button id="export-csv" class="btn">Export as .csv</button>
        <button id="export-json" class="btn">Export as .json</button>
      </div>
      <div class="row wrap">
        <button id="data-import" class="btn">Import backup</button>
        <button id="data-clear" class="btn btn--danger">Clear all data</button>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
      <div class="row end">
        <button id="data-close" class="btn btn--primary">Close</button>
      </div>
    </dialog>

    <dialog id="stats" class="sheet">
      <h2>Local usage counters</h2>
      <p class="muted small">Stored on this device only. Nothing is sent anywhere.</p>
      <pre id="stats-body" class="sheet__body"></pre>
      <div class="row end">
        <button id="stats-clear" class="btn">Reset</button>
        <button id="stats-close" class="btn btn--primary">Close</button>
      </div>
    </dialog>

    <script type="module" src="__PANEL_JS__"></script>
  </body>
</html>
