<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Highlighter</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar__title">
        <h1 id="page-title">Web Highlighter</h1>
        <p id="page-meta" class="muted"></p>
      </div>
      <button id="refresh" class="icon-btn" title="Reload this page's highlights" aria-label="Reload">&#8635;</button>
    </header>

    <section id="controls" class="controls" hidden>
      <label class="field">
        <span class="field__label">Page note</span>
        <textarea id="page-note" rows="2" placeholder="Why did you save this?"></textarea>
      </label>

      <div class="row">
        <div class="segmented" role="group" aria-label="Export scope">
          <button id="scope-highlights" class="seg seg--on" type="button">Highlights only</button>
          <button id="scope-page" class="seg" type="button">Full page</button>
        </div>
      </div>

      <div class="row options">
        <label class="check"><input type="checkbox" id="opt-meta" /> Metadata</label>
        <label class="check"><input type="checkbox" id="opt-notes" /> Notes</label>
        <label class="check"><input type="checkbox" id="opt-url" /> Source URL</label>
      </div>

      <div class="row exports">
        <button id="copy" class="btn btn--primary">Copy as Markdown</button>
        <button id="dl-md" class="btn">.md</button>
        <button id="dl-html" class="btn">.html</button>
        <button id="dl-pdf" class="btn">.pdf</button>
        <button id="dl-txt" class="btn">.txt</button>
      </div>
    </section>

    <main id="body" class="body">
      <div id="state" class="state">
        <p class="state__text">Select text on any page to highlight it.</p>
      </div>
      <ol id="list" class="list" hidden></ol>
    </main>

    <footer class="footer">
      <span id="status" class="muted small"></span>
      <span class="footer__actions">
        <button id="data-toggle" class="link-btn">Data</button>
        <button id="stats-toggle" class="link-btn">Usage</button>
      </span>
    </footer>

    <dialog id="data" class="sheet">
      <h2>Your data</h2>
      <p class="muted small">
        Everything lives in this browser's local storage. Nothing is uploaded, and there is no account.
      </p>
      <p id="quota" class="muted small"></p>
      <div class="row wrap">
        <button id="data-export" class="btn">Export all data</button>
        <button id="data-import" class="btn">Import</button>
        <button id="page-clear" class="btn">Clear this page</button>
        <button id="data-clear" class="btn btn--danger">Clear all data</button>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
      <div class="row end">
        <button id="data-close" class="btn btn--primary">Close</button>
      </div>
    </dialog>

    <dialog id="stats" class="sheet">
      <h2>Local usage counters</h2>
      <p class="muted small">Stored on this device only. Nothing is sent anywhere.</p>
      <pre id="stats-body" class="sheet__body"></pre>
      <div class="row end">
        <button id="stats-clear" class="btn">Reset</button>
        <button id="stats-close" class="btn btn--primary">Close</button>
      </div>
    </dialog>

    <script type="module" src="__PANEL_JS__"></script>
  </body>
</html>
